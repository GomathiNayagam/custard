# Directory containing raw FASTQ files
input_dir: "/home/sgomathi/CUSTARD/custard/data/fastq"

# Output directory
output_dir: "/home/sgomathi/CUSTARD/custard/results"

# DADA2 formatted database
taxa_db: "/home/sgomathi/CUSTARD/custard/data/db/dada2_formatted_rpoc_amplicon.fasta"

# Kraken2 database
kraken_db: "/home/sgomathi/CUSTARD/custard/data/db/kraken_amplicon"

# Threads
threads: 20

# Default taxonomy assignment method
method: "kraken2"

# KO inference
