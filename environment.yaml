name: custard
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  # --- Workflow ---
  - snakemake-minimal>=7.32

  # --- Amplicon processing ---
  - cutadapt>=4.4
  - kraken2>=2.1
  - vsearch>=2.23

  # --- R + DADA2 ---
  - r-base>=4.3
  - bioconductor-dada2>=1.28
  - r-ggplot2
  - r-reshape2
  - r-dplyr

  # --- Python scientific stack ---
  - python>=3.10,<3.13
  - biopython>=1.81
  - scipy>=1.11
  - numpy>=1.24
  - pandas>=2.0
  - matplotlib>=3.7
  - seaborn>=0.12
  - pyyaml>=6.0
  - scikit-bio>=0.5
  - scikit-learn>=1.3

  # --- CLI ---
  - click>=8.0

  # --- Visualization ---
  - krona

  # --- Utilities ---
  - pigz
  - seqtk

  # --- pip packages ---
  - six  # required by ete3; not pulled in automatically via pip
  - pip:
    - ete3
